<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>abi food diary</title>
<style>
  @font-face {
    font-family: 'WakingTheWitch';
    src: url('font.woff2') format('woff2');
    font-display: swap;
  }

  :root {
    --pink-1: #ffe3f0;
    --pink-2: #ffc4de;
    --pink-3: #ff8fb8;
    --pink-4: #ff5fa2;
    --rose: #ff4d94;
    --cream: #fffafd;
    --shadow: rgba(255, 77, 148, 0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'WakingTheWitch', 'Comic Sans MS', 'Segoe Script', cursive;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.85) 0%, transparent 40%),
      radial-gradient(circle at 85% 25%, rgba(255,182,213,0.75) 0%, transparent 45%),
      radial-gradient(circle at 50% 90%, rgba(255,205,228,0.9) 0%, transparent 50%),
      linear-gradient(160deg, var(--pink-1) 0%, var(--pink-2) 45%, #ffd3e6 100%);
    background-attachment: fixed;
    min-height: 100vh;
    overflow-x: hidden;
    color: #b3135e;
  }

  /* crazy rainbow cursor replaces the normal one */
  * { cursor: none !important; }
  #cursor-star {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    pointer-events: none;
    width: 26px;
    height: 26px;
    background: currentColor;
    clip-path: polygon(0 0, 0 100%, 23% 100%, 45% 55%, 100% 100%, 100% 81%, 50% 41%, 23% 47%);
    filter: drop-shadow(0 0 6px currentColor) drop-shadow(0 0 14px currentColor);
    will-change: transform, color;
    display: none;
  }
  #cursor-ring {
    position: fixed;
    z-index: 9998;
    pointer-events: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2px solid;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 16px currentColor, inset 0 0 10px currentColor;
    will-change: transform, color;
    display: none;
  }

  #sparkle-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 80px;
  }

  /* ── Header ─────────────────────────────── */
  header {
    text-align: center;
    padding: 45px 15px 30px;
    position: relative;
  }

  header h1 {
    font-size: clamp(2.6rem, 7vw, 5rem);
    font-weight: normal;
    letter-spacing: 2px;
    color: var(--rose);
    text-shadow: 3px 3px 0 #fff,
                 -3px 3px 0 #fff,
                 3px -3px 0 #fff,
                 -3px -3px 0 #fff,
                 0 6px 18px var(--shadow);
    animation: floaty 4s ease-in-out infinite;
  }

  header .subtitle {
    margin-top: 12px;
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    color: #d4317d;
    background: rgba(255,255,255,0.6);
    display: inline-block;
    padding: 6px 22px;
    border-radius: 60px;
    border: 2px dashed var(--pink-3);
    backdrop-filter: blur(4px);
  }

  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-8px); }
  }

  .header-rose { font-size: 1.4rem; letter-spacing: 8px; color: var(--pink-4); }

  /* lets you keep track of how many pics you love */
  .love-count {
    margin: 16px auto 0;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 1.2rem;
    color: #fff;
    background: linear-gradient(135deg, var(--pink-3), var(--rose));
    padding: 7px 22px;
    border-radius: 60px;
    border: 2px dashed #fff;
    box-shadow: 0 6px 16px var(--shadow);
  }
  .love-count .heart-ico { animation: pulse 1.4s ease-in-out infinite; }
  .love-count #likeCount { font-size: 1.35rem; }

  /* top social links */
  .top-socials {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin-top: 26px;
  }
  .top-socials .social-link { padding: 8px 16px; font-size: 1.02rem; }

  /* ── Gallery ────────────────────────────── */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 34px;
    margin-top: 40px;
  }

  .frame {
    position: relative;
    background: var(--cream);
    border-radius: 18px;
    padding: 14px 14px 8px;
    box-shadow: 0 12px 30px var(--shadow), 0 2px 6px rgba(255,77,148,.15);
    border: 3px solid #fff;
    outline: 2px solid var(--pink-3);
    transition: transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s;
    animation: popIn .6s backwards;
    cursor: pointer;
  }

  .frame:nth-child(3n+1) { transform: rotate(-2deg); }
  .frame:nth-child(3n+2) { transform: rotate(1.5deg); }
  .frame:nth-child(3n+3) { transform: rotate(-1deg); }

  .frame:hover {
    transform: rotate(0deg) translateY(-10px) scale(1.04);
    box-shadow: 0 22px 45px var(--shadow), 0 6px 12px rgba(255,77,148,.22);
    z-index: 5;
  }

  /* scalloped / stitched cute edge */
  .frame::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 13px;
    border: 2px dashed var(--pink-3);
    opacity: .7;
    pointer-events: none;
  }

  /* little bow on top of the frame */
  .frame .bow {
    position: absolute;
    top: -16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.7rem;
    filter: drop-shadow(0 3px 4px var(--shadow));
    z-index: 2;
    transition: transform .3s;
  }
  .frame:hover .bow { transform: translateX(-50%) scale(1.2) rotate(10deg); }

  .like {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: none;
    background: #fff;
    box-shadow: 0 4px 12px var(--shadow), 0 0 0 2px var(--pink-2);
    font-size: 1.4rem;
    line-height: 1;
    cursor: pointer;
    display: grid;
    place-items: center;
    color: var(--pink-4);
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), background .3s, color .3s;
    z-index: 3;
  }
  .like:hover { transform: scale(1.18) rotate(-8deg); }
  .like.liked {
    background: linear-gradient(135deg, #ff5fa2, #ff2e63);
    color: #fff;
    box-shadow: 0 6px 16px rgba(255,46,99,.45), 0 0 0 3px var(--pink-2);
  }
  .like.liked span { animation: heartPop .4s ease; }
  @keyframes heartPop {
    0% { transform: scale(0); }
    60% { transform: scale(1.35); }
    100% { transform: scale(1); }
  }
  .like-count {
    position: absolute;
    top: 66px;
    right: 16px;
    background: #fff;
    color: var(--rose);
    font-size: 0.95rem;
    padding: 2px 11px;
    border-radius: 40px;
    border: 2px dashed var(--pink-3);
    box-shadow: 0 4px 10px var(--shadow);
    z-index: 3;
    line-height: 1.4;
    white-space: nowrap;
  }
  .like-count b { animation: heartPop .3s ease; display: inline-block; }

  .frame img {
    width: 100%;
    height: 230px;
    object-fit: cover;
    border-radius: 12px;
    display: block;
    background: linear-gradient(135deg, #ffe9f3, #ffd0e3);
    border: 2px solid #fff;
  }

  .frame figcaption {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    text-align: center;
    font-size: 0.9rem;
    padding: 11px 4px 8px;
    color: var(--pink-4);
    letter-spacing: 2px;
  }

  @keyframes popIn {
    from { opacity: 0; transform: translateY(30px) scale(.9); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Lightbox ───────────────────────────── */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(66, 5, 38, 0.75);
    backdrop-filter: blur(6px);
    transition: opacity .3s;
  }
  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 90vw;
    max-height: 85vh;
    border-radius: 20px;
    border: 10px solid #fff;
    outline: 4px solid var(--pink-3);
    box-shadow: 0 20px 60px rgba(0,0,0,.45), 0 0 40px rgba(255,143,184,.6);
    animation: popIn .35s;
  }

  .lightbox .close {
    position: absolute;
    top: 20px;
    right: 30px;
    font-size: 3rem;
    color: #fff;
    cursor: pointer;
    text-shadow: 0 3px 10px rgba(0,0,0,.4);
    transition: transform .3s;
  }
  .lightbox .close:hover { transform: rotate(90deg) scale(1.2); }
  .lightbox .cap {
    position: absolute;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 1.4rem;
    background: rgba(255,77,148,.4);
    padding: 6px 24px;
    border-radius: 40px;
    border: 2px dashed #fff;
  }

  /* ── Footer ─────────────────────────────── */
  footer {
    text-align: center;
    margin-top: 60px;
    font-size: 1.2rem;
    color: #d4317d;
  }
  footer .hearts { letter-spacing: 6px; color: var(--pink-4); animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* ── Socials ────────────────────────────── */
  .socials {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 14px;
    margin-bottom: 28px;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }
  .socials .s-label {
    width: 100%;
    font-size: 1.45rem;
    color: #d4317d;
    margin-bottom: 4px;
  }
  .social-link {
    text-decoration: none;
    color: #d4317d;
    background: #fff;
    border: 2px solid var(--pink-3);
    padding: 10px 20px;
    border-radius: 60px;
    font-size: 1.08rem;
    box-shadow: 0 6px 14px var(--shadow);
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: transform .3s cubic-bezier(.34,1.56,.64,1), box-shadow .3s, background .3s;
  }
  .social-link:hover {
    transform: translateY(-4px) scale(1.07) rotate(-2deg);
    background: var(--pink-2);
    box-shadow: 0 12px 24px var(--shadow);
  }
  .social-link.insta  { background: linear-gradient(135deg,#fff, #ffe0f1); }
  .social-link.x      { background: #fff; }
  .social-link.tiktok { background: linear-gradient(135deg, #fff, #fff7fb); }
  .social-link.roblox { background: linear-gradient(135deg, #fff, #f0f4ff); }

  /* ── Scrollbar ──────────────────────────── */
  ::-webkit-scrollbar { width: 12px; }
  ::-webkit-scrollbar-track { background: var(--pink-1); }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--pink-3), var(--pink-4));
    border-radius: 20px;
    border: 3px solid var(--pink-1);
  }

  @media (max-width: 520px) {
    .gallery { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
    .frame img { height: 160px; }
  }
</style>
</head>
<body>

<canvas id="sparkle-canvas"></canvas>
<div id="cursor-ring"></div>
<div id="cursor-star"></div>

<div class="container">
  <header>
    <div class="header-rose">✿ ♡ ⋆ ✿ ♡ ⋆</div>
    <h1>hi this is my food</h1>
    <p class="subtitle">i know it might be messy but i love the taste ♡</p>
    <div class="love-count"><span id="likeCount">0</span> hearts</div>
    <div class="top-socials">
      <a class="social-link insta" href="https://www.instagram.com/eyesacrossthehill/" target="_blank" rel="noopener"><span>♡</span> instagram</a>
      <a class="social-link x" href="https://x.com/moteikon" target="_blank" rel="noopener"><span>✿</span> x</a>
      <a class="social-link tiktok" href="https://www.tiktok.com/@meowmeowmeow122" target="_blank" rel="noopener"><span>⋆</span> tiktok</a>
      <a class="social-link roblox" href="https://www.roblox.com/users/90603862/profile" target="_blank" rel="noopener"><span>🌸</span> roblox</a>
      <a class="social-link roblox" href="https://www.roblox.com/communities/15274273/Mountain-Priestess" target="_blank" rel="noopener"><span>✧</span> mountain priestess</a>
    </div>
    <div class="header-rose">⋆ ♡ ✿ ⋆ ♡ ✿</div>
  </header>

  <main class="gallery" id="gallery"></main>

  <footer>
    <div>hope u like the food ♡</div>
    <div class="hearts">♡ ♡ ♡</div>
  </footer>
</div>

<div class="lightbox" id="lightbox">
  <span class="close">✕</span>
  <img id="lb-img" src="" alt="">
  <div class="cap" id="lb-cap"></div>
</div>

<script>
  const IMAGES = [
    "IMG_1099.jpg", "IMG_1189.jpg", "IMG_1478.jpg", "IMG_2288.jpg",
    "IMG_2853.jpg", "IMG_2873.jpg", "IMG_2874.png", "IMG_2876.jpg",
    "IMG_6304.jpg", "IMG_6619.jpg", "IMG_8494.png", "IMG_8994.png",
    "IMG_8996.png", "IMG_8997.png", "IMG_8998.png", "IMG_9251.jpg",
    "IMG_9479.png", "IMG_9587.jpg", "IMG_9751.jpg", "IMG_9974.jpg"
  ];

  const BOWS = ["🎀", "✿", "🌸", "♡", "🌟", "💗", "🦋"];

  const likeState = JSON.parse(localStorage.getItem('foodLikes') || '{"counts":{},"myLikes":{}}');

  function countOf(name) { return likeState.counts[name] || 0; }
  function totalLikes() {
    return Object.values(likeState.counts).reduce((a, b) => a + b, 0);
  }

  const likeCountEl = document.getElementById('likeCount');
  function updateHeaderCount() {
    const n = totalLikes();
    likeCountEl.textContent = n;
    likeCountEl.style.transform = 'scale(1.35)';
    setTimeout(() => { likeCountEl.style.transform = 'scale(1)'; }, 180);
  }
  updateHeaderCount();

  const gallery = document.getElementById('gallery');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lb-img');
  const lbCap = document.getElementById('lb-cap');

  IMAGES.forEach((name, i) => {
    const fig = document.createElement('figure');
    fig.className = 'frame';
    fig.style.animationDelay = (i * 0.06) + 's';
    fig.innerHTML = `
      <span class="bow">${BOWS[i % BOWS.length]}</span>
      <img src="Images/${name}" alt="cute memory ${i + 1}" loading="lazy">
      <figcaption>
        <span>${BOWS[(i + 1) % BOWS.length]}</span>
        <span>♡</span>
        <span>${BOWS[(i + 2) % BOWS.length]}</span>
      </figcaption>`;

    const likeBtn = document.createElement('button');
    likeBtn.className = 'like';
    likeBtn.title = 'i love this one ♡';
    likeBtn.innerHTML = '<span>♡</span>';
    if (likeState.myLikes[name]) {
      likeBtn.classList.add('liked');
      likeBtn.querySelector('span').textContent = '♥';
    }
    const likeBadge = document.createElement('span');
    likeBadge.className = 'like-count';
    likeBadge.innerHTML = `♥ <b>${countOf(name)}</b>`;
    likeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const willLike = !likeState.myLikes[name];
      likeBtn.classList.toggle('liked', willLike);
      likeBtn.querySelector('span').textContent = willLike ? '♥' : '♡';
      if (willLike) {
        likeState.counts[name] = countOf(name) + 1;
        likeState.myLikes[name] = true;
        const r = e.currentTarget.getBoundingClientRect();
        spawnBurst(r.left + r.width / 2, r.top + r.height / 2, 14);
      } else {
        likeState.counts[name] = Math.max(0, countOf(name) - 1);
        delete likeState.myLikes[name];
      }
      likeBadge.querySelector('b').textContent = countOf(name);
      localStorage.setItem('foodLikes', JSON.stringify(likeState));
      updateHeaderCount();
    });
    fig.appendChild(likeBtn);
    fig.appendChild(likeBadge);

    fig.addEventListener('click', () => {
      lbImg.src = fig.querySelector('img').src;
      lbCap.textContent = fig.querySelector('figcaption').textContent;
      lightbox.classList.add('open');
    });
    gallery.appendChild(fig);
  });

  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox || e.target.classList.contains('close')) {
      lightbox.classList.remove('open');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') lightbox.classList.remove('open');
  });

  /* ================= SPARKLES ✨ ================= */
  const canvas = document.getElementById('sparkle-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const COLORS = ['#ffffff', '#ffd7ea', '#ff9ec7', '#ff6fb5', '#fff3fa', '#ffe0a3'];

  function starPath(x, y, r, points = 4) {
    ctx.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const rad = i % 2 === 0 ? r : r * 0.4;
      const a = (i * Math.PI) / points - Math.PI / 2;
      const px = x + Math.cos(a) * rad;
      const py = y + Math.sin(a) * rad;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // ambient floating sparkles
  const ambient = [];
  const AMBIENT_COUNT = 45;
  for (let i = 0; i < AMBIENT_COUNT; i++) {
    ambient.push(newSparkle(true));
  }

  function newSparkle(isAmbient) {
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      r: 1.5 + Math.random() * 5,
      vy: isAmbient ? -(0.15 + Math.random() * 0.45) : 0,
      vx: (Math.random() - 0.5) * 0.3,
      tw: Math.random() * Math.PI * 2,
      ts: 0.02 + Math.random() * 0.04,
      color: COLORS[(Math.random() * COLORS.length) | 0],
      life: isAmbient ? 1 : 1,
      fade: isAmbient ? 0 : 0.012 + Math.random() * 0.02,
      rot: (Math.random() - 0.5) * 0.15
    };
  }

  // cursor-following sparkles
  const cursorTrail = [];
  const MAX_TRAIL = 300;
  let lastSpawn = 0;

  window.addEventListener('mousemove', (e) => {
    const now = performance.now();
    if (now - lastSpawn < 18) return;  // don't spam-spawn while moving fast
    lastSpawn = now;

    for (let i = 0; i < 3; i++) {
      const s = newSparkle(false);
      s.x = e.clientX + (Math.random() - 0.5) * 12;
      s.y = e.clientY + (Math.random() - 0.5) * 12;
      s.r = 2 + Math.random() * 4;
      s.vx = (Math.random() - 0.5) * 1.1;
      s.vy = (Math.random() - 0.5) * 1.1 - 0.3;
      s.fade = 0.004 + Math.random() * 0.008;   // slower, smoother fade
      cursorTrail.push(s);
    }
    if (cursorTrail.length > MAX_TRAIL) cursorTrail.splice(0, cursorTrail.length - MAX_TRAIL);
  });

  function spawnBurst(x, y, count) {
    for (let i = 0; i < count; i++) {
      const s = newSparkle(false);
      const a = (i / count) * Math.PI * 2 + Math.random() * 0.6;
      s.x = x;
      s.y = y;
      s.r = 1.5 + Math.random() * 5;
      s.vx = Math.cos(a) * (1.5 + Math.random() * 2);
      s.vy = Math.sin(a) * (1.5 + Math.random() * 2) - 0.8;
      s.fade = 0.006 + Math.random() * 0.01;
      cursorTrail.push(s);
    }
  }

  // little burst on click 💥
  window.addEventListener('click', (e) => {
    spawnBurst(e.clientX, e.clientY, 10);
  });

  let tick = 0;
  function draw() {
    ctx.clearRect(0, 0, W, H);
    tick += 0.016;

    // ambient
    for (const s of ambient) {
      s.y += s.vy;
      s.x += s.vx + Math.sin(tick + s.tw) * 0.2;
      s.tw += s.ts;
      if (s.y < -20) { s.y = H + 20; s.x = Math.random() * W; }
      if (s.x < -20) s.x = W + 20;
      if (s.x > W + 20) s.x = -20;

      const alpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(s.tw));
      ctx.globalAlpha = alpha;
      ctx.fillStyle = s.color;
      ctx.save();
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      starPath(0, 0, s.r);
      ctx.fill();
      ctx.restore();
    }

    // cursor trail
    for (let i = cursorTrail.length - 1; i >= 0; i--) {
      const s = cursorTrail[i];
      s.x += s.vx;
      s.y += s.vy;
      s.vy += 0.03;
      s.r *= 0.99;
      s.life -= s.fade;
      s.rot += 0.03;
      if (s.life <= 0.02 || s.r < 0.5) { cursorTrail.splice(i, 1); continue; }

      ctx.save();
      ctx.globalAlpha = Math.pow(Math.max(s.life, 0), 1.4) * 0.9;
      ctx.shadowColor = s.color;
      ctx.shadowBlur = 10;
      ctx.fillStyle = s.color;
      ctx.translate(s.x, s.y);
      ctx.rotate(s.rot);
      starPath(0, 0, s.r);
      ctx.fill();
      ctx.restore();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();

  /* ─── crazy rainbow cursor ─── */
  const cursorStar = document.getElementById('cursor-star');
  const cursorRing = document.getElementById('cursor-ring');
  let mouseX = -9999, mouseY = -9999, curX = -9999, curY = -9999, hueTime = 0;

  window.addEventListener('mousemove', (e) => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursorStar.style.display = 'block';
    cursorRing.style.display = 'block';
  });
  document.addEventListener('mouseleave', () => {
    cursorStar.style.display = 'none';
    cursorRing.style.display = 'none';
  });

  (function cursorLoop() {
    hueTime += 0.02;
    curX += (mouseX - curX) * 0.35;
    curY += (mouseY - curY) * 0.35;

    const hue = (hueTime * 720) % 360;            // zooms through the whole rainbow
    const flash = 1 + 0.25 * Math.sin(hueTime * 22); // flashing scale pulse
    const color = `hsl(${hue}, 100%, 62%)`;
    const color2 = `hsl(${(hue + 100) % 360}, 100%, 62%)`;

    cursorStar.style.transform = `translate(${curX}px, ${curY}px) scale(${flash})`;
    cursorStar.style.color = color;
    cursorRing.style.transform = `translate(${curX}px, ${curY}px) translate(-50%,-50%) scale(${1.1 - flash * 0.25})`;
    cursorRing.style.borderColor = color2;
    cursorRing.style.boxShadow = `0 0 18px ${color2}, inset 0 0 12px ${color}`;
    cursorRing.style.color = color2;

    requestAnimationFrame(cursorLoop);
  })();
</script>
</body>
</html>
